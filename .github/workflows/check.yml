name: Plugin checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        astrbot: ["4.25.0", "4.28.2"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install uv
          uv pip install --system "astrbot==${{ matrix.astrbot }}" pytest ruff -r requirements.txt
      - name: Lint
        run: python -m ruff check .
      - name: Regression tests
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q main.py onebot.py
